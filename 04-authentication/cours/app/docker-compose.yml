
services:
  api:
    build: .
    volumes:
      - ./:/app
    command: ["uvicorn", "main:app", "--host", "0.0.0.0", "--port", "5001", "--reload"]
    ports:
    - "5001:5001"
    env_file:
      - .env

  db:
    image: postgres
    restart: always
    env_file:
      - .env
    ports:
    - "5432:5432"
    volumes:
      - postgres_data_auth:/var/lib/postgresql/data

volumes:
  postgres_data_auth: